name: Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on tags matching v1.0.0, v2.1.3, etc.

jobs:
  build_and_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Create .env
        run: |
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> .env
          echo "CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}" >> .env
          echo "ANDROID_CLIENT_ID=${{ secrets.ANDROID_CLIENT_ID }}" >> .env
          
      - name: Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean --non-interactive
        
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          
      - name: Inject Gradle Signing Config
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/app/build.gradle';
            let content = fs.readFileSync(path, 'utf8');

            const signingBlock = \`
        signingConfigs {
            release {
                storeFile file('release.jks')
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEYSTORE_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }\`;

            // Insert signingConfigs before buildTypes
            content = content.replace(
                /(\s*buildTypes\s*\{)/,
                signingBlock + '\$1'
            );

            // Wire release buildType to use signingConfig
            content = content.replace(
                /(buildTypes\s*\{[^}]*release\s*\{)/,
                '\$1\n            signingConfig signingConfigs.release'
            );

            fs.writeFileSync(path, content);
            console.log('Signing config injected.');
          "

      - name: Make Gradle Executable
        run: chmod +x android/gradlew
        
      - name: Build APK + AAB Release
        env:
          EXPO_PUBLIC_API_MODE: production
          NODE_ENV: production
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Extract Release Notes
        id: release_notes
        run: |
          node -e "
            const fs = require('fs');
            const version = process.env.GITHUB_REF_NAME;
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            // Match the header for the current version and capture everything until the next header
            const escapeRegex = (s) => s.replace(/[-\/\\\\^\$*+?.()|[\]{}]/g, '\\\\\$&');
            const match = changelog.match(new RegExp('## \\\[' + escapeRegex(version) + '\\\].*?\\\\n([\\\\s\\\\S]*?)(?=\\\\n## |\$)', 'i'));
            let notes = match ? match[1].trim() : 'Bug fixes and performance improvements.';
            fs.writeFileSync('RELEASE_NOTES.txt', notes);
          "
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          name: Release ${{ github.ref_name }}
          body_path: RELEASE_NOTES.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
